# Production static server for the built client (Dockerfile, target `prod`).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (react-router's BrowserRouter, e.g. /j-lens) have no
    # file on disk: serve the app and let the router resolve them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
